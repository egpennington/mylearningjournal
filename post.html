<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Create Blog Post</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/media.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>
<body>
    <div class="container" id="post">
        <header>
            <a href="index.html" class="logo-anchor">
            <div class="logo-header">
                <img src="images/logo1.png" alt="logo image" class="logo">
                <p>Dashboard</p>
            </div>
            </a>     
            <ul class="header-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="post.html">Add Post</a></li>
            </ul>
        </header>
        <main>
            <form id="postBlogForm" class="postBlogForm">
                <label for="imageInput" class="imageBtn">+ Add Image</label>
                <input type="file" id="imageInput" name="image" accept="image/*" style="display: none">

                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="Blog title...">

                <label for="date">Date</label>
                <input type="date" id="date" name="date">

                <label for="body">Blog Post</label>
                <textarea name="body" id="body" placeholder="Write your blog..." rows="10"></textarea>

                <button type="submit" class="submitBtn">Post</button>
            </form>
        </main>
    </div>
    <footer>
        My Learning Journal
        <p>Copyright  &copy; <span id="copyright-year"></span></p>
    </footer>
    <script src="main.js"></script>
</body>
